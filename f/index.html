<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Follow a flight live · Windowside</title>
<meta name="description" content="Someone shared a flight with you. See where it is and roughly when it lands.">
<meta property="og:title" content="Follow this flight">
<meta property="og:description" content="See where the plane is and roughly when it lands. Shared from Windowside.">
<meta property="og:image" content="https://windowside.frusoft.dev/icon.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0B0F17">
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">
<style>
  /* Tokens mirror ios/Windowside/Design/Theme.swift (dark-only night-flight look). */
  :root {
    --canvas: #0B0F17; --surface: #131A26; --surface-sunk: #1B2433; --hairline: #1E2738; --track: #2A3547;
    --ink: #EEF2F7; --ink-2: #A9B4C4; --ink-3: #8792A3;
    --accent: #FFB547; --on-accent: #1A1204; --live: #5CD6FF;
    --serif: ui-serif, "New York", Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--canvas); color: var(--ink);
    font: 16px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 32px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  header img { width: 32px; height: 32px; border-radius: 8px; }
  header span { font-family: var(--serif); font-weight: 700; font-size: 18px; }
  .eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .12em; color: var(--live); text-transform: uppercase; }
  h1 { font-family: var(--serif); font-size: clamp(28px, 7vw, 40px); line-height: 1.1; margin: 8px 0 6px; }
  .sub { color: var(--ink-2); margin: 0 0 16px; }
  .code { font-family: var(--mono); color: var(--ink-2); font-size: 14px; }
  .map { position: relative; height: min(52vh, 480px); border-radius: 20px; overflow: hidden;
    border: 1px solid var(--hairline); background: var(--surface); }
  .map > div { width: 100%; height: 100%; }
  .map .fallback { display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--ink-3); }
  .status { background: var(--surface); border: 1px solid var(--hairline); border-radius: 20px; padding: 16px 18px; margin-top: 12px; }
  .status .big { font-family: var(--serif); font-weight: 700; font-size: 28px; line-height: 1.15; }
  .status .detail { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
  .bar { position: relative; height: 6px; border-radius: 3px; background: var(--track); margin: 14px 0 4px; }
  .bar span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
  .note { color: var(--ink-3); font-size: 13px; margin: 10px 2px 22px; }
  .note a { color: var(--ink-2); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { flex: 1 1 220px; display: flex; align-items: center; justify-content: center; min-height: 48px;
    border-radius: 14px; font-weight: 600; text-decoration: none; }
  .primary { background: var(--accent); color: var(--on-accent); }
  .secondary { background: var(--surface-sunk); color: var(--ink); }
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 20px; padding: 20px; }
  .pin { position: relative; width: 14px; height: 14px; }
  .pin i { position: absolute; inset: 4px; border-radius: 50%; background: var(--accent); }
  .pin b { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(255,181,71,.45); }
  .pin span { position: absolute; left: 20px; top: -2px; font: 600 12px var(--mono); color: var(--ink); white-space: nowrap;
    text-shadow: 0 0 3px var(--canvas), 0 0 3px var(--canvas); }
  .plane { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(92,214,255,.18) 0 34%, transparent 35%); box-shadow: inset 0 0 0 1px rgba(92,214,255,.35); }
  .plane svg { width: 26px; height: 26px; fill: var(--ink); stroke: var(--canvas); stroke-width: 1; }
  .get { color: var(--ink-3); font-size: 14px; text-align: center; margin: 28px 0 0; }
  .get a { color: var(--accent); text-decoration: none; font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header><img src="../icon.png" alt=""><span>Windowside</span></header>

  <section id="flight" hidden>
    <div class="eyebrow" id="eyebrow" data-t="eyebrow">Shared flight</div>
    <h1 id="title"></h1>
    <p class="sub"><span id="airline"></span> <span class="code" id="codes"></span></p>
    <div class="map" id="mapBox"><div id="map" role="img" aria-label="Map"></div></div>
    <div class="status" id="status" hidden>
      <div class="big" id="big"></div>
      <div class="detail" id="detail"></div>
      <div class="bar" aria-hidden="true"><span id="bar"></span></div>
    </div>
    <p class="note" id="note"></p>
    <div class="actions">
      <a class="btn primary" id="live" rel="noopener" data-t="live">See it live on ADSB.lol</a>
      <a class="btn secondary" id="open" data-t="open">Open in Windowside</a>
    </div>
  </section>

  <p class="get" id="get"></p>

  <section id="missing" class="card" hidden>
    <h1 data-t="missingTitle">This link has no flight</h1>
    <p class="sub" data-t="missingBody">Ask whoever sent it to share it again from Windowside.</p>
  </section>
</main>
<script>
// Replaced with the domain-restricted MapKit JS token by scripts/deploy-site.sh; never committed.
const MAPKIT_TOKEN = "__MAPKIT_TOKEN__";

(() => {
  const es = (navigator.language || "en").toLowerCase().startsWith("es");
  const locale = es ? "es" : "en";
  const T = es ? {
    eyebrow: "Vuelo compartido", live: "Verlo en vivo en ADSB.lol", open: "Abrir en Windowside",
    missingTitle: "Este enlace no tiene vuelo", missingBody: "Pídele a quien lo envió que lo comparta otra vez desde Windowside.",
    doc: "Sigue un vuelo · Windowside",
    landsIn: d => "Aterriza en unas " + d, landed: "Ya debería haber aterrizado",
    around: t => "Hacia las " + t + " en tu hora",
    estimated: m => "Posición estimada a partir de la que se compartió hace " + m + ".",
    noPos: "El avión no estaba en el aire cuando se compartió. Míralo en vivo en ADSB.lol.",
    credit: 'Posición de receptores comunitarios de <a href="https://adsb.lol" rel="noopener">ADSB.lol</a> (ODbL). Ruta de <a href="https://www.adsbdb.com" rel="noopener">adsbdb.com</a>. Mapa de Apple.',
    noMap: "El mapa no está disponible ahora mismo.", min: "min", h: "h",
    get: 'Seguido con <a href="../">Windowside</a>, una bitácora de vuelos gratis para iPhone.'
  } : {
    doc: "Follow a flight · Windowside",
    landsIn: d => "Lands in about " + d, landed: "Should have landed by now",
    around: t => "Around " + t + " your time",
    estimated: m => "Estimated from the position shared " + m + " ago.",
    noPos: "The plane wasn’t in the air when this was shared. See it live on ADSB.lol.",
    credit: 'Position from <a href="https://adsb.lol" rel="noopener">ADSB.lol</a> community receivers (ODbL). Route from <a href="https://www.adsbdb.com" rel="noopener">adsbdb.com</a>. Map by Apple.',
    noMap: "The map isn’t available right now.", min: "min", h: "h",
    get: 'Tracked with <a href="../">Windowside</a>, a free flight logbook for iPhone.'
  };
  document.documentElement.lang = locale;
  document.querySelectorAll("[data-t]").forEach(el => { const v = T[el.dataset.t]; if (v) el.textContent = v; });
  document.title = T.doc;
  const $ = id => document.getElementById(id);
  $("get").innerHTML = T.get;

  // --- Link ---
  const q = new URLSearchParams(location.search);
  const raw = (q.get("n") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (!/^[A-Z0-9]{3,8}$/.test(raw)) { $("missing").hidden = false; return; }
  const hex = /^[0-9a-f]{6}$/.test(q.get("h") || "") ? q.get("h") : null;
  const num = k => { const v = parseFloat(q.get(k)); return Number.isFinite(v) ? v : null; };
  const shared = num("la") != null && num("lo") != null && num("t") != null
    ? { lat: num("la"), lon: num("lo"), track: num("tr"), kmh: num("gs"), t: num("t") * 1000 } : null;

  const pretty = /^[A-Z0-9]{2}\d/.test(raw) && raw.length <= 6 ? raw.slice(0, 2) + " " + raw.slice(2) : raw;
  $("title").textContent = pretty;
  $("open").href = "windowside://follow/" + raw;
  $("live").href = "https://adsb.lol/?" + (hex ? "icao=" + hex : "callsign=" + raw);
  $("note").innerHTML = T.credit;
  $("flight").hidden = false;

  // --- Great-circle maths (same as WindowsideKit Geo / FlightProgress) ---
  const R = 6371.0088, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
  const vec = p => [Math.cos(rad(p.lat)) * Math.cos(rad(p.lon)), Math.cos(rad(p.lat)) * Math.sin(rad(p.lon)), Math.sin(rad(p.lat))];
  const dist = (a, b) => {
    const h = Math.sin(rad(b.lat - a.lat) / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(rad(b.lon - a.lon) / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  };
  const lerp = (a, b, t) => {
    const A = vec(a), B = vec(b), w = Math.acos(Math.max(-1, Math.min(1, A[0] * B[0] + A[1] * B[1] + A[2] * B[2])));
    if (w < 1e-9) return a;
    const s1 = Math.sin((1 - t) * w) / Math.sin(w), s2 = Math.sin(t * w) / Math.sin(w);
    const x = s1 * A[0] + s2 * B[0], y = s1 * A[1] + s2 * B[1], z = s1 * A[2] + s2 * B[2];
    return { lat: deg(Math.atan2(z, Math.hypot(x, y))), lon: deg(Math.atan2(y, x)) };
  };
  const bearing = (a, b) => {
    const y = Math.sin(rad(b.lon - a.lon)) * Math.cos(rad(b.lat));
    const x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) - Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(rad(b.lon - a.lon));
    return (deg(Math.atan2(y, x)) + 360) % 360;
  };
  const path = (a, b) => { const n = Math.max(2, Math.ceil(dist(a, b) / 50)); return Array.from({ length: n + 1 }, (_, i) => lerp(a, b, i / n)); };
  // Remaining distance at ground speed, plus up to 10 minutes for the approach (FlightProgress.timeToLanding).
  const secondsToLanding = (km, kmh) => kmh >= 180 ? km / kmh * 3600 + 600 * Math.min(1, km / 150) : null;
  const span = s => { const m = Math.max(1, Math.round(s / 60)); return m >= 60 ? Math.floor(m / 60) + " " + T.h + " " + (m % 60) + " " + T.min : m + " " + T.min; };

  // Where the plane should be now: carried along its great circle to the destination at its shared ground speed.
  const estimate = (origin, dest) => {
    if (!shared) return null;
    const from = { lat: shared.lat, lon: shared.lon };
    const left = dist(from, dest);
    const flownSince = shared.kmh ? shared.kmh * Math.max(0, Date.now() - shared.t) / 3600000 : 0;
    const pos = left > 0 ? lerp(from, dest, Math.min(1, flownSince / left)) : dest;
    const remaining = Math.max(0, left - flownSince);
    const flown = dist(origin, pos);
    return { pos, remaining, fraction: flown / (flown + remaining || 1), eta: secondsToLanding(remaining, shared.kmh || 0),
             heading: remaining > 1 ? bearing(pos, dest) : (shared.track || 0) };
  };

  // --- Map (Apple MapKit JS) ---
  let map = null, mk = null, overlays = [], planeAnn = null;
  const mapReady = new Promise(resolve => {
    if (!MAPKIT_TOKEN || MAPKIT_TOKEN.startsWith("__")) return resolve(false);
    window.initMapKit = () => {
      mk = window.mapkit;
      mk.init({ authorizationCallback: done => done(MAPKIT_TOKEN), language: locale });
      map = new mk.Map("map", {
        colorScheme: mk.Map.ColorSchemes.Dark, mapType: mk.Map.MapTypes.MutedStandard,
        pointOfInterestFilter: mk.PointOfInterestFilter.excludingAllCategories,
        showsCompass: mk.FeatureVisibility.Hidden, showsZoomControl: false, showsMapTypeControl: false,
        isRotationEnabled: false, padding: new mk.Padding(40, 40, 40, 40)
      });
      resolve(true);
    };
    const s = document.createElement("script");
    s.src = "https://cdn.apple-mapkit.com/mk/5.x.x/mapkit.core.js";
    s.crossOrigin = "anonymous"; s.async = true;
    s.dataset.callback = "initMapKit"; s.dataset.libraries = "map,annotations,overlays";
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });

  const coord = p => new mk.Coordinate(p.lat, p.lon);
  const line = (pts, style) => new mk.PolylineOverlay(pts.map(coord), { style: new mk.Style(style) });
  const pin = (p, code) => new mk.Annotation(coord(p), () => {
    const el = document.createElement("div"); el.className = "pin";
    el.innerHTML = "<b></b><i></i><span></span>"; el.querySelector("span").textContent = code; return el;
  }, { anchorOffset: new DOMPoint(0, 0), title: code, displayPriority: 1000 });
  const planeEl = heading => {
    const el = document.createElement("div"); el.className = "plane";
    el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.8 0 1.3.9 1.3 2v5l7.2 4.3v2l-7.2-2.2v4l2.1 1.6v1.3L12 19.6l-3.4.9v-1.3l2.1-1.6v-4l-7.2 2.2v-2l7.2-4.3v-5c0-1.1.5-2 1.3-2z"/></svg>';
    el.firstChild.style.transform = "rotate(" + heading + "deg)"; return el;
  };

  function draw(route, est, first) {
    if (!map) return;
    map.removeOverlays(overlays);
    const flownStyle = { strokeColor: "#FFB547", lineWidth: 2.4, lineCap: "round" };
    const restStyle = { strokeColor: "#5CD6FF", lineWidth: 1.8, lineCap: "round", lineDash: [2, 6] };
    overlays = est
      ? [line(path(route.origin, est.pos), { ...flownStyle, strokeOpacity: 0.2, lineWidth: 9 }), line(path(route.origin, est.pos), flownStyle), line(path(est.pos, route.dest), restStyle)]
      : [line(path(route.origin, route.dest), restStyle)];
    map.addOverlays(overlays);
    if (planeAnn) { map.removeAnnotation(planeAnn); planeAnn = null; }
    if (est && est.remaining > 0) {
      planeAnn = new mk.Annotation(coord(est.pos), () => planeEl(est.heading), { title: pretty, displayPriority: 1000 });
      map.addAnnotation(planeAnn);
    }
    if (first) {
      map.addAnnotations([pin(route.origin, route.originCode), pin(route.dest, route.destCode)]);
      map.showItems(overlays, { animate: false, padding: new mk.Padding(48, 48, 48, 48) });
    }
  }

  function status(est) {
    if (!est) { $("big").textContent = ""; $("detail").textContent = T.noPos; $("status").hidden = false; $("bar").parentElement.hidden = true; return; }
    const ago = span((Date.now() - shared.t) / 1000);
    if (est.remaining <= 0 || est.eta == null) {
      $("big").textContent = T.landed;
    } else {
      $("big").textContent = T.landsIn(span(est.eta));
    }
    const lines = [];
    if (est.eta != null && est.remaining > 0) {
      const at = new Date(Date.now() + est.eta * 1000);
      lines.push(T.around(at.toLocaleTimeString(locale, { hour: "numeric", minute: "2-digit" })));
    }
    lines.push(T.estimated(ago));
    $("detail").textContent = lines.join(" · ");
    $("bar").style.width = Math.round(Math.min(1, est.fraction) * 100) + "%";
    $("status").hidden = false;
  }

  // --- Route, then draw and keep the estimate moving ---
  fetch("https://api.adsbdb.com/v0/callsign/" + raw)
    .then(r => r.ok ? r.json() : null)
    .then(async j => {
      const r = j && j.response && j.response.flightroute;
      const ok = await mapReady;
      if (!ok) {
        // No MapKit JS token (or Apple's script failed): embed ADSB.lol's own live map instead.
        const p = new URLSearchParams({ hideSidebar: "", hideButtons: "", desktop: "", zoom: "6" });
        if (hex) p.set("icao", hex); else p.set("callsign", raw);
        const frame = document.createElement("iframe");
        frame.title = "Live map"; frame.referrerPolicy = "no-referrer";
        frame.style.cssText = "width:calc(100% + 210px);margin-left:-210px;height:100%;border:0;display:block";
        frame.src = "https://adsb.lol/?" + p.toString().replace(/=(&|$)/g, "$1");
        $("mapBox").replaceChildren(frame);
      }
      if (!r) { status(null); return; }
      const city = a => a.municipality || a.name;
      const route = {
        origin: { lat: r.origin.latitude, lon: r.origin.longitude }, dest: { lat: r.destination.latitude, lon: r.destination.longitude },
        originCode: r.origin.iata_code, destCode: r.destination.iata_code
      };
      $("title").textContent = pretty + " · " + city(r.origin) + " → " + city(r.destination);
      $("airline").textContent = (r.airline && r.airline.name) || "";
      $("codes").textContent = r.origin.iata_code + " → " + r.destination.iata_code;
      if (shared) $("eyebrow").textContent = es ? "Vuelo compartido · estimado" : "Shared flight · estimated";
      const tick = first => { const est = estimate(route.origin, route.dest); draw(route, est, first); status(est); };
      tick(true);
      setInterval(() => tick(false), 30000);
    })
    .catch(() => status(null));
})();
</script>
</body>
</html>
